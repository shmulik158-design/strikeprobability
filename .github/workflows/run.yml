name: run

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the :00/:30 peak when Actions delays schedules most
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild price history"
        type: boolean
        default: false

permissions:
  contents: write   # force-push tracker.db to the data branch
  pages: write      # deploy site/
  id-token: write   # required by deploy-pages
  actions: write    # keepalive: gh workflow enable

concurrency:
  group: run
  cancel-in-progress: false   # never kill a run that may be mid-push of the database

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore tracker.db from the data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:tracker.db > data/tracker.db
            echo "restored $(stat -c%s data/tracker.db) bytes"
          else
            echo "no data branch yet; starting with an empty database"
          fi

      - name: Collect and export
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Force-push tracker.db as a single commit on the orphan data branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/tracker.db'); assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'"
          tmp=$(mktemp -d)
          cp data/tracker.db "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add tracker.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Keepalive (resets the 60-day inactivity timer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable run.yml --repo "$GITHUB_REPOSITORY"

  backup:
    # Weekly copy of tracker.db as a release asset, since the data branch keeps no history.
    if: github.event_name == 'schedule'
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: Upload weekly backup (Sundays UTC, once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" = "7" ] || { echo "not Sunday"; exit 0; }
          tag="db-$(date -u +%Y-%m-%d)"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "already backed up"; exit 0; }
          git init -q . && git fetch -q --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          git show FETCH_HEAD:tracker.db > tracker.db
          gh release create "$tag" tracker.db --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "Weekly tracker.db backup" --latest=false
